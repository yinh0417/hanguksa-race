<!doctype html>
<html lang="ko" data-version="dev">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이동규 선생님과 함께하는 한국사 복습 퀴즈 레이스</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/common.css?v=dev">
<style>
  body { background: var(--cheong-deep); color: var(--baek); min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  .front { width: min(460px, 100%); display: grid; gap: 18px; text-align: center; }
  .front h1 { font-size: clamp(28px, 8.5vw, 44px); word-break: keep-all; letter-spacing: -0.03em; color: #fff; }
  .front p { margin: 0; font-size: 21px; color: #ccc; }
  .front .btn { display: block; text-decoration: none; font-size: 18px; font-weight: 300; padding: 14px 28px; }
  .front .teacher-link { color: var(--primary-on-dark); font-size: 17px; text-decoration: none; }
  .front .car { width: 46%; margin: 0 auto; }
  .front .car .car-svg { filter: drop-shadow(3px 5px 15px rgba(0,0,0,.35)); }
</style>
</head>
<body>
<main class="front">
  <div class="car" id="car"></div>
  <h1><span class="title-top">이동규 선생님과 함께하는</span> 한국사 복습 퀴즈 레이스</h1>
  <p>문제를 맞히면 앞으로, 아이템으로 역전!</p>
  <a class="btn yellow" href="play.html">학생으로 들어가기</a>
  <a class="teacher-link" href="teacher.html">선생님 화면</a>
</main>
<script src="js/config.js?v=dev"></script>
<script>window.GAME = { era: () => ({}) };</script>
<script src="js/art.js?v=dev"></script>
<script>document.getElementById('car').innerHTML = ART.carSVG(Math.floor(Math.random() * 8));</script>
</body>
</html>
