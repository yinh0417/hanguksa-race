<!doctype html>
<html lang="ko" data-version="dev">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#173A8A">
<title>이동규 선생님과 함께하는 한국사 복습 퀴즈 레이스</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/common.css?v=dev">
<link rel="stylesheet" href="css/play.css?v=dev">
</head>
<body class="phone">
<div id="offline" class="offline hidden">인터넷 연결이 끊겼어요. 다시 연결되면 그대로 이어서 달려요.</div>

<!-- 입장 코드 -->
<main id="sCode" class="screen hidden">
  <h1 class="logo"><span class="title-top">이동규 선생님과 함께하는</span> 한국사 복습 퀴즈 레이스</h1>
  <form id="codeForm" class="card">
    <label for="codeInput" class="big-label">큰 화면의 입장 코드 4자리</label>
    <input id="codeInput" type="tel" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" autocomplete="off" placeholder="0000">
    <p id="codeErr" class="err" role="alert"></p>
    <button class="btn primary wide" type="submit">들어가기</button>
  </form>
</main>

<!-- 닉네임과 차 -->
<main id="sJoin" class="screen hidden">
  <h1 class="logo small"><span class="title-top">이동규 선생님과 함께하는</span> 한국사 복습 퀴즈 레이스</h1>
  <form id="joinForm" class="card">
    <p id="joinNote" class="note hidden"></p>
    <label for="nickInput" class="big-label" id="nickLabel">닉네임 (10글자까지)</label>
    <input id="nickInput" type="text" maxlength="10" autocomplete="off" placeholder="닉네임">
    <p class="big-label">내 출석번호</p>
    <div id="noPick" class="no-pick" role="radiogroup" aria-label="출석번호 고르기"></div>
    <p class="big-label">내 탈것 고르기</p>
    <div id="carPick" class="car-pick" role="radiogroup" aria-label="탈것 고르기"></div>
    <p id="joinErr" class="err" role="alert"></p>
    <button class="btn primary wide" type="submit">입장하기</button>
  </form>
  <!-- 탈것을 누르면 크게 보기 -->
  <div id="carView" class="car-view hidden" role="dialog" aria-modal="true" aria-labelledby="cvName">
    <div class="cv-card">
      <p class="cv-group" id="cvGroup"></p>
      <div class="cv-stage">
        <button type="button" class="cv-nav" id="cvPrev" aria-label="이전 탈것">‹</button>
        <div class="cv-car" id="cvCar"></div>
        <button type="button" class="cv-nav" id="cvNext" aria-label="다음 탈것">›</button>
      </div>
      <h2 id="cvName"></h2>
      <div class="cv-btns">
        <button type="button" class="btn" id="cvBack">다시 고를래요</button>
        <button type="button" class="btn primary" id="cvPick">이걸로 할래요</button>
      </div>
    </div>
  </div>
</main>

<!-- 기다리기 -->
<main id="sWait" class="screen hidden">
  <div class="wait">
    <div id="waitCar" class="wait-car"></div>
    <p id="waitNick" class="wait-nick"></p>
    <h2 id="waitTitle"></h2>
    <p id="waitText" class="wait-text"></p>
    <div id="waitCount" class="wait-count hidden"></div>
  </div>
</main>

<!-- 레이스 -->
<main id="sRace" class="screen race-screen hidden">
  <div id="stuBg" class="stu-bg" aria-hidden="true"></div>
  <div class="hud">
    <div class="mini" id="mini" role="img" aria-label="전체 코스에서 내 위치"></div>
    <span class="st-time" id="stTime">5:00</span>
    <div class="rank-box" id="rankBox" aria-live="polite"><b id="stRank">-</b><span>등</span><small id="stN">/ -명</small></div>
  </div>
  <p class="st-scene" id="stScene"></p>
  <div class="qtime"><span id="qBar"></span></div>
  <section class="qcard" id="qCard">
    <p class="q-type" id="qType"></p>
    <p class="q-text" id="qText"></p>
    <div class="q-pic" id="qPic" aria-hidden="true"></div>
  </section>
  <div class="answers" id="answers"></div>
  <div class="item-slot">
    <span id="shieldMark" class="shield-mark hidden">🛡️ 거북선 방패 있음</span>
    <button id="itemBtn" class="btn item-btn hidden" type="button"></button>
  </div>
  <!-- 아이템을 누르면 크게 보기: 공격 아이템은 맞힐 친구를 직접 골라요 -->
  <div id="itemView" class="item-view hidden" role="dialog" aria-modal="true" aria-labelledby="ivName">
    <div class="iv-card">
      <i class="iv-timer" id="ivTimer" aria-hidden="true"></i>
      <div class="iv-icon" id="ivIcon" aria-hidden="true"></div>
      <h2 id="ivName"></h2>
      <p class="iv-desc" id="ivDesc"></p>
      <p class="iv-hint" id="ivHint"></p>
      <div class="iv-list" id="ivList"></div>
      <div class="iv-btns">
        <button type="button" class="btn" id="ivBack">나중에 쓸래요</button>
        <button type="button" class="btn primary" id="ivUse">지금 쓸래요</button>
      </div>
    </div>
  </div>
  <div id="overlay" class="overlay hidden" aria-live="assertive">
    <div class="ov-icon" id="ovIcon"></div>
    <div class="ov-car" id="ovCar" aria-hidden="true"></div>
    <p class="ov-title" id="ovTitle"></p>
    <p class="ov-sub" id="ovSub"></p>
    <p class="ov-count" id="ovCount"></p>
  </div>
  <div id="fxPop" class="fx-pop hidden" aria-live="polite">
    <p class="fx-title" id="fxTitle"></p>
    <div class="fx-stage" aria-hidden="true"><div class="fx-lines" id="fxLines"></div><div class="fx-car" id="fxCar"></div><div class="fx-proj" id="fxProj"></div></div>
    <p class="fx-sub" id="fxSub"></p>
  </div>
  <div id="flash" class="flash hidden" aria-live="polite"></div>
  <div id="coolPop" class="cool-pop hidden" aria-live="polite">
    <div class="cp-head"><span aria-hidden="true">🧊</span><div><b>쿨링 타임</b><small>잠시 멈춤! 핵심 개념을 머릿속으로 정리해요</small></div><i id="coolCount"></i></div>
    <ol id="coolCards" class="cp-cards"></ol>
  </div>
  <div id="rankPop" class="rank-pop hidden" aria-hidden="true"><small id="rankPopTag">순위 상승!</small><b id="rankPopNo"></b><span id="rankPopUp"></span></div>
</main>

<!-- 끝 -->
<main id="sDone" class="screen hidden">
  <div class="done">
    <div id="doneCar" class="wait-car"></div>
    <h2 id="doneTitle"></h2>
    <p id="doneRank" class="done-rank"></p>
    <p id="doneStat" class="done-stat"></p>
    <p class="wait-text">큰 화면을 봐 주세요.</p>
  </div>
</main>

<!-- 안내 -->
<main id="sMsg" class="screen hidden">
  <div class="card msg">
    <h2 id="msgTitle"></h2>
    <p id="msgText"></p>
    <button id="msgRetry" class="btn primary wide hidden" type="button">다시 연결하기</button>
    <a id="msgHome" class="btn primary wide" href="play.html">처음으로</a>
  </div>
</main>

<div class="toast-wrap" id="toasts" aria-live="polite"></div>

<p class="maker">만든이 이동규T</p>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="js/config.js?v=dev"></script>
<script src="js/db.js?v=dev"></script>
<script src="js/rules.js?v=dev"></script>
<script src="js/art.js?v=dev"></script>
<script src="js/tracks.js?v=dev"></script>
<script src="js/pictures.js?v=dev"></script>
<script src="js/play.js?v=dev"></script>
</body>
</html>
